name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: vulnshop
  IMAGE_TAG: ${{ github.sha }}

jobs:

  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  sast:
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sca:
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  checkov:
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform-ec2
          framework: terraform
          soft_fail: true

  docker:
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca
      - checkov

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          debug: true

          script: |
            set -e

            APP_DIR=/home/ubuntu/GITHUB-PROJECT

            echo "===== USER ====="
            whoami

            echo "===== HOST ====="
            hostname

            echo "===== PROJECT ====="

            if [ ! -d "$APP_DIR/.git" ]; then
                git clone "${{ secrets.EC2_REPO_URL }}" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin
            git checkout main
            git pull origin main

            docker compose down || true

            docker compose build --no-cache

            docker compose up -d

            docker compose ps

            docker ps -a

            for i in $(seq 1 30)
            do
              if curl -fs http://localhost:3000/healthz >/dev/null 2>&1
              then
                  echo "Application Started"
                  exit 0
              fi

              echo "Waiting..."
              sleep 2
            done

            docker compose logs --tail=200

            exit 1

  dast:
    runs-on: ubuntu-latest
    needs: deploy

    steps:

      - name: Run OWASP ZAP
        run: |
          mkdir zap-report

          docker run --rm \
            -v $PWD/zap-report:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://${{ secrets.EC2_HOST }}:3000 \
            -a \
            -I \
            -r report.html \
            -w report.md \
            -J report.json || true
